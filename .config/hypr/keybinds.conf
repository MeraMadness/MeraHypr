# Set some apps
$files = nautilus
$browser = firefox

# Bind
bind = SUPER, Return, exec, kitty
bind = SUPER, D, exec, qs -c noctalia-shell ipc call launcher toggle
bind = SUPER, E, exec, $files
bind = SUPER, L, exec, hyprlock
bind = ALT, F, exec, $browser
bind = ALT, V, exec, /opt/visual-studio-code/code
bind = SUPER SHIFT, B, exec, killall -SIGUSR2 waybar
bind = SUPER, B, exec, killall -SIGUSR1 waybar
bind = SUPER SHIFT, N, exec, qs -c noctalia-shell ipc call notifications toggleHistory
bind = SUPER SHIFT, C, exec, qs -c noctalia-shell ipc call controlCenter toggle
bind = ALT, Tab, exec, killall rofi || ~/.config/hypr/scripts/waybar-switcher.sh
bind = SUPER, X, exec, killall rofi || ~/.config/hypr/scripts/rofi-main-menu-center.sh
bind = SUPER, V, exec, /opt/resolve/bin/resolve
bind = SUPER, C, exec, qs -c noctalia-shell ipc call launcher calculator
bind = SUPER, F4, exec, qs -c noctalia-shell ipc call sessionMenu toggle

# Screenshots
bind = , Insert, exec, grim ~/Pictures/Screenshots/$(date +'%s_grim.png')
bind = CTRL, Insert, exec, grim -g "$(slurp -o)" ~/Pictures/Screenshots/$(date +'%s_grim.png')
bind = CTRL SHIFT, Insert, exec, ~/repos/screenshot.sh

# Set Wallpapers
bind = SUPER SHIFT, W, exec, qs -c noctalia-shell ipc call wallpaper toggle
bind = SUPER CTRL, W, exec, qs -c noctalia-shell ipc call wallpaper random

# WM 
bind = SUPER, Q, killactive,
bind = SUPER SHIFT, Q, exit,
bind = SUPER, F, fullscreen,
bind = SUPER, Space, togglefloating,
bind = SUPER, P, pseudo,
bind = SUPER, S, togglesplit,

# Change Workspace Mode
bind = SUPER SHIFT, Space, workspaceopt, allfloat
bind = SUPER SHIFT, P, workspaceopt, allpseudo

bind = SUPER, Tab, cyclenext,
bind = SUPER, Tab, bringactivetotop,

# Focus
bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d

# Move 
bind = SUPER SHIFT, left, movewindow, l
bind = SUPER SHIFT, right, movewindow, r
bind = SUPER SHIFT, up, movewindow, u
bind = SUPER SHIFT, down, movewindow, d 

# Resize
bind = SUPER CTRL, left, resizeactive, -20 0
bind = SUPER CTRL, right, resizeactive, 20 0
bind = SUPER CTRL, up, resizeactive, 0 -20
bind = SUPER CTRL, down, resizeactive, 0 20 

# Special 
bind = SUPER, a, togglespecialworkspace
bind = SUPERSHIFT, a, movetoworkspace, special
bind = SUPER, a, exec, notify-send 'Toggled Special Workspace'
bind = SUPER, c, exec, hyprctl dispatch centerwindow

# Zoom Window
bind = SUPER , Z, exec, pypr zoom ++0.5
bind = SUPER SHIFT, Z, exec, pypr zoom

# Switch 
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10
bind = SUPER ALT, up, workspace, e+1
bind = SUPER ALT, down, workspace, e-1

# Move Window
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 0, movetoworkspace, 10

# Mouse Binding
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow
bind = SUPER, mouse_down, workspace, e+1
bind = SUPER, mouse_up, workspace, e-1

# Audio
bind = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bind = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bind = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bind = , XF86AudioMicMute, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle

bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous
bind = , XF86audiostop, exec, playerctl stop

