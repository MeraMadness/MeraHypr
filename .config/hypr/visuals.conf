# Pywal Color Scheme 
source = ~/.cache/wal/hyprland-colors.conf

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 3
    col.active_border = 0x000000 0x23272A 45deg
    layout = dwindle
    allow_tearing = false
}

decoration {
    rounding = 20
    rounding_power = 2
    
    blur {
        enabled = true
        size = 3
        passes = 2
        vibrancy = 0.1696

        xray = true
        new_optimizations = false
    }

    shadow {
    enabled = true
    range = 4
    render_power = 3
    color = rgba(1a1a1aee)
    }

    dim_inactive = false
}


plugin {
    hyprbars {
        bar_height = 32
        bar_color = rgb(171717)
        col.text = $foreground
        bar_text_size = 12
        bar_text_font = Jetbrains Mono Nerd Font Mono Bold
        bar_button_padding = 10
        bar_padding = 15
        bar_precedence_over_border = true
        bar_buttons_alignment = left
        icons_on_hover = true
        bar_blur = true
        hyprbars-button = rgb(ff5f56), 15, , hyprctl dispatch killactive
        hyprbars-button = rgb(ffbd2e), 15, , hyprctl dispatch togglefloating
        hyprbars-button = rgb(27c93f), 15, , hyprctl dispatch fullscreen 2
        on_double_click = hyprctl dispatch fullscreen 1
   }

   hyprfoci {
		# can be from -1 to 1, will be
			# dynamic ratio with the window instead.
			# recommend fixed size for image as dynamic can look weird
			# leave one as 0 to keep original image ratio (image only)
		# width, height
		size = 100, 0 			

		# shift down right (can be from -1 to 1, similarly)
		pos = 0, -35

		#0: left/top, 1: middle, 2: down/right
		origin = 1, 0 

        # path to a directory with both.png, left.png, right.png
		# Absolute path is needed (~ for home directory is fine)
		imgs = /home/mera/Pictures/bongo/ 
	}

  hyprtrails {
    color = rgb(8839EF)
  }
}


dwindle { #Default from the OG Hyprland Conf
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    pseudotile = yes # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = yes # you probably want this
}

misc { #Other Settings
    disable_hyprland_logo = false
    disable_splash_rendering = false
    mouse_move_enables_dpms = true
    vfr = true
    vrr = 1
    animate_manual_resizes = true
    mouse_move_focuses_monitor = true
    enable_swallow = true
}

layerrule {
  name = noctalia
  match:namespace = noctalia-background-.*$
  ignore_alpha = 0.5
  blur = true
  blur_popups = true
}
